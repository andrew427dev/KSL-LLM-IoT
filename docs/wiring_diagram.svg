<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="dot" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5">
      <circle cx="3.5" cy="3.5" r="2.6" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="620" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#202124">KSL-LLM-IoT 하드웨어 결선도</text>

  <!-- ── Raspberry Pi 중앙 핀 헤더 ── -->
  <rect x="388" y="66" width="164" height="476" rx="10" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
  <text x="470" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Raspberry Pi 4B</text>

  <!-- 좌측 핀 라벨 -->
  <g font-size="10.5" fill="#ffffff">
    <text x="396" y="123">5V (P2)</text>
    <text x="396" y="152">GPIO2 SDA (P3)</text>
    <text x="396" y="181">GPIO3 SCL (P5)</text>
    <text x="396" y="210">GND (P6)</text>
    <text x="396" y="291">GPIO17 (P11)</text>
    <text x="396" y="361">GPIO22 (P15)</text>
    <text x="396" y="396">GND (P25)</text>
  </g>
  <!-- 우측 핀 라벨 -->
  <g font-size="10.5" fill="#ffffff" text-anchor="end">
    <text x="544" y="123">GPIO5 (P29)</text>
    <text x="544" y="152">GPIO6 (P31)</text>
    <text x="544" y="181">GPIO13 (P33)</text>
    <text x="544" y="210">GPIO19 (P35)</text>
    <text x="544" y="301">USB</text>
    <text x="544" y="361">3.5mm</text>
  </g>

  <!-- ── 좌측 컴포넌트 ── -->
  <rect x="40" y="96" width="210" height="124" rx="8" fill="#2980b9" stroke="#1f618d" stroke-width="1.5"/>
  <text x="145" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">I2C LCD 20×4 (0x27)</text>
  <text x="145" y="143" text-anchor="middle" font-size="10.5" fill="#eaf2f8">VCC · SDA · SCL · GND</text>

  <rect x="40" y="262" width="210" height="52" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="145" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Active Buzzer</text>

  <rect x="40" y="344" width="210" height="64" rx="8" fill="#f1c40f" stroke="#b7950b" stroke-width="1.5"/>
  <text x="145" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">Status LED</text>
  <text x="145" y="391" text-anchor="middle" font-size="10" fill="#5f6368">+ via 220–330Ω 저항</text>

  <!-- ── 우측 컴포넌트 ── -->
  <rect x="690" y="92" width="210" height="132" rx="8" fill="#16a085" stroke="#117a65" stroke-width="1.5"/>
  <text x="795" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">Push Buttons ×4</text>
  <text x="795" y="138" text-anchor="middle" font-size="10.5" fill="#e8f8f5">완료 = GPIO5</text>
  <text x="795" y="156" text-anchor="middle" font-size="10.5" fill="#e8f8f5">초기화(undo) = GPIO6</text>
  <text x="795" y="174" text-anchor="middle" font-size="10.5" fill="#e8f8f5">정중 = GPIO13</text>
  <text x="795" y="192" text-anchor="middle" font-size="10.5" fill="#e8f8f5">친근 = GPIO19</text>
  <text x="795" y="212" text-anchor="middle" font-size="9.5" fill="#d1f2eb">공통 다리 → GND (P6)</text>

  <rect x="690" y="276" width="210" height="50" rx="8" fill="#8e44ad" stroke="#6c3483" stroke-width="1.5"/>
  <text x="795" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">USB Webcam</text>

  <rect x="690" y="344" width="210" height="66" rx="8" fill="#e67e22" stroke="#ca6f1e" stroke-width="1.5"/>
  <text x="795" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">Active Speaker</text>
  <text x="795" y="390" text-anchor="middle" font-size="10" fill="#fdf2e9">3.5mm 오디오 + USB 전원</text>

  <!-- ── 배선: LCD (I2C) ── -->
  <line x1="250" y1="118" x2="388" y2="118" stroke="#e74c3c" stroke-width="2"/>
  <text x="319" y="113" text-anchor="middle" font-size="9" fill="#e74c3c">5V</text>
  <line x1="250" y1="148" x2="388" y2="148" stroke="#3498db" stroke-width="2"/>
  <text x="319" y="143" text-anchor="middle" font-size="9" fill="#3498db">SDA</text>
  <line x1="250" y1="177" x2="388" y2="177" stroke="#3498db" stroke-width="2"/>
  <text x="319" y="172" text-anchor="middle" font-size="9" fill="#3498db">SCL</text>
  <line x1="250" y1="206" x2="388" y2="206" stroke="#2c3e50" stroke-width="2"/>
  <text x="319" y="201" text-anchor="middle" font-size="9" fill="#2c3e50">GND</text>

  <!-- 배선: Buzzer -->
  <line x1="250" y1="282" x2="388" y2="287" stroke="#f39c12" stroke-width="2"/>
  <text x="319" y="278" text-anchor="middle" font-size="9" fill="#b9770e">GPIO17</text>
  <line x1="250" y1="300" x2="388" y2="206" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="300" y="258" text-anchor="middle" font-size="9" fill="#2c3e50">GND P6</text>

  <!-- 배선: LED -->
  <line x1="250" y1="368" x2="388" y2="357" stroke="#f39c12" stroke-width="2"/>
  <text x="319" y="356" text-anchor="middle" font-size="9" fill="#b9770e">GPIO22</text>
  <line x1="250" y1="392" x2="388" y2="392" stroke="#2c3e50" stroke-width="2"/>
  <text x="319" y="387" text-anchor="middle" font-size="9" fill="#2c3e50">GND P25</text>

  <!-- 배선: Buttons -->
  <line x1="552" y1="118" x2="690" y2="120" stroke="#f39c12" stroke-width="1.8"/>
  <line x1="552" y1="148" x2="690" y2="142" stroke="#f39c12" stroke-width="1.8"/>
  <line x1="552" y1="177" x2="690" y2="164" stroke="#f39c12" stroke-width="1.8"/>
  <line x1="552" y1="206" x2="690" y2="186" stroke="#f39c12" stroke-width="1.8"/>
  <text x="625" y="100" text-anchor="middle" font-size="9" fill="#b9770e">GPIO 5·6·13·19</text>

  <!-- 배선: Webcam -->
  <line x1="552" y1="300" x2="690" y2="301" stroke="#8e44ad" stroke-width="2.2"/>
  <text x="621" y="295" text-anchor="middle" font-size="9" fill="#8e44ad">USB 3.0</text>

  <!-- 배선: Speaker -->
  <line x1="552" y1="360" x2="690" y2="372" stroke="#27ae60" stroke-width="2"/>
  <text x="621" y="353" text-anchor="middle" font-size="9" fill="#1e8449">3.5mm 오디오</text>
  <line x1="552" y1="300" x2="690" y2="392" stroke="#e74c3c" stroke-width="1.6"/>
  <text x="640" y="345" text-anchor="middle" font-size="9" fill="#e74c3c">USB 2.0 전원</text>

  <!-- ── 범례 ── -->
  <g font-size="11" fill="#2c3e50">
    <rect x="40" y="470" width="860" height="118" rx="8" fill="#fafafa" stroke="#d5dbdb" stroke-width="1"/>
    <text x="56" y="494" font-weight="bold">배선 색상</text>
    <line x1="56" y1="512" x2="86" y2="512" stroke="#e74c3c" stroke-width="3"/><text x="92" y="516">5V 전원</text>
    <line x1="200" y1="512" x2="230" y2="512" stroke="#2c3e50" stroke-width="3"/><text x="236" y="516">GND</text>
    <line x1="320" y1="512" x2="350" y2="512" stroke="#3498db" stroke-width="3"/><text x="356" y="516">I2C (SDA/SCL)</text>
    <line x1="500" y1="512" x2="530" y2="512" stroke="#f39c12" stroke-width="3"/><text x="536" y="516">GPIO 신호</text>
    <line x1="660" y1="512" x2="690" y2="512" stroke="#8e44ad" stroke-width="3"/><text x="696" y="516">USB 데이터</text>
    <line x1="56" y1="538" x2="86" y2="538" stroke="#27ae60" stroke-width="3"/><text x="92" y="542">오디오(3.5mm)</text>
    <text x="56" y="566" font-size="10" fill="#5f6368">버튼은 내부 풀업 — 각 핀과 GND(P6) 사이 연결(눌림=LOW). 상태 LED의 GND는 P6이 아닌 P25(SPI0 SCLK 아래).</text>
    <text x="56" y="582" font-size="10" fill="#5f6368">증폭 스피커는 USB(전원)와 3.5mm(오디오)를 모두 연결해야 동작한다.</text>
  </g>
</svg>
